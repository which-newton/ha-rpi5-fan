name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    # Home Assistant's own manifest/structure validator. HACS expects this to pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the latest tagged release rather than @main: a validator that
      # can change under you turns a green build into a red one with no commit.
      - uses: hacs/action@22.5.0
        with:
          category: integration
