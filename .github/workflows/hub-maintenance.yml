# Generated by tpdowns-hub/scripts/install-hub-maintenance.py; no checkout or secrets.
name: Hub maintenance
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  hub-maintenance:
    name: Hub maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a hub impact assessment
        shell: bash
        run: |
          python3 - <<'PY'
          """Validate a PR's hub handoff using event data only; no credentials or network."""
          import json
          import os
          import re
          import sys


          def validate(event):
              body = (event.get("pull_request") or {}).get("body") or ""
              if not isinstance(body, str):
                  raise ValueError("The pull request needs a Hub-Impact assessment.")
              body = re.sub(r"<!--[\s\S]*?-->", "", body)
              body = re.sub(r"(?m)^\s*(`{3,}|~{3,})[^\n]*\n[\s\S]*?^\s*\1\s*$", "", body)
              fields = {}
              for key in ("Impact", "Reason", "PR"):
                  matches = re.findall(rf"^Hub-{key}:[ \t]*(.*)$", body, re.MULTILINE)
                  if len(matches) > 1:
                      raise ValueError(f"Keep one unambiguous Hub-{key} field.")
                  fields[key] = matches[0].strip() if matches else ""
              if fields["Impact"] not in ("none", "update"):
                  raise ValueError("Set Hub-Impact to none or update, outside examples/comments.")
              reason = fields["Reason"]
              if len(reason) < 20 or len(reason.split()) < 4 or reason.startswith(("<", "TODO", "TBD")):
                  raise ValueError("Hub-Reason must explain the actual change or why the hub stays accurate.")
              if fields["Impact"] == "update":
                  own_pr = fields["PR"] == "this" and (event.get("repository") or {}).get("full_name") == "which-newton/tpdowns-hub"
                  if not own_pr and not re.fullmatch(r"https://github\.com/which-newton/tpdowns-hub/pull/[1-9][0-9]*", fields["PR"]):
                      raise ValueError("Hub-PR must link the corresponding tpdowns-hub pull request (the hub itself may use this).")
              elif fields["PR"]:
                  raise ValueError("Leave Hub-PR blank for no impact, or use Hub-Impact: update for a hub change.")
              return fields["Impact"]


          if __name__ == "__main__":
              try:
                  with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                      impact = validate(json.load(source))
                  print(f"Hub maintenance assessment recorded: {impact}. Review linked work and release evidence separately.")
              except (ValueError, KeyError, OSError, TypeError) as error:
                  print(f"Hub maintenance: {error}", file=sys.stderr)
                  sys.exit(1)
          PY
